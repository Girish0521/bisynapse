# BISynapse — Render Blueprint Configuration
# Deploy this as a Blueprint from the Render dashboard (New → Blueprint)
# OR manually configure the service with the exact values commented below.
#
# ┌─────────────────────────────────────────┐
# │  MANUAL RENDER DASHBOARD SETTINGS       │
# │  Root Directory : backend               │
# │  Build Command  : npm install           │
# │  Start Command  : node server.js        │
# └─────────────────────────────────────────┘

services:
  - type: web
    name: bisynapse-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: ""   # Set to your Vercel URL, e.g. https://bisynapse.vercel.app
